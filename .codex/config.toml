# Codex가 기본으로 사용할 모델을 정합니다.
# 현재 값 `gpt-5.4-mini`는 속도와 품질의 균형을 우선하는 설정입니다.
# 다른 대표 값으로는 `gpt-5.4`, `gpt-5.5`, `gpt-5.3-codex`가 있습니다.
# 더 큰 모델은 답변과 추론 품질이 좋아질 수 있지만, 보통 응답이 무거워집니다.
model = "gpt-5.4-mini"

# 일반 작업에서 사용할 추론 강도를 정합니다.
# 현재 값 `medium`은 보통 수준의 깊이로 빠르게 판단하는 의미입니다.
# 다른 대표 값은 `low`, `high`, `xhigh`입니다.
# 값을 높이면 더 꼼꼼해지지만 느려질 수 있고, 낮추면 더 빠르지만 놓치는 부분이 늘 수 있습니다.
model_reasoning_effort = "medium"

# 계획 모드에서 사용할 추론 강도를 정합니다.
# 현재 값 `high`는 작업을 시작하기 전에 더 깊게 구조를 따져보겠다는 뜻입니다.
# 다른 대표 값은 `low`, `medium`, `xhigh`입니다.
# 값을 높이면 계획이 더 신중해지고, 낮추면 계획은 빨라지지만 세부 누락 가능성이 커집니다.
plan_mode_reasoning_effort = "high"

# Codex가 작업할 수 있는 샌드박스 범위를 정합니다.
# 현재 값 `workspace-write`는 작업 폴더 안에서는 읽기와 쓰기가 가능하다는 뜻입니다.
# 다른 대표 값은 `read-only`와 `danger-full-access`가 있습니다.
# 더 제한하면 안전성은 높아지고, 더 넓히면 자유도는 올라가지만 실수 위험도 커집니다.
sandbox_mode = "workspace-write"

# 파일 수정이나 명령 실행 때 사용자 승인 방식을 정합니다.
# 현재 값 `on-request`는 필요할 때만 권한을 요청하는 방식입니다.
# 다른 대표 값은 `never`와 `on-failure`입니다.
# 더 엄격하게 두면 통제는 강해지고, 완화하면 자동화는 쉬워지지만 승인 범위가 넓어집니다.
approval_policy = "on-request"

[agents]
# 동시에 돌릴 수 있는 에이전트 수를 정합니다.
# 현재 값 `max_threads = 4`는 한 번에 최대 4개까지 병렬로 작업하게 합니다.
# 다른 대표 값은 1이나 2처럼 더 적게 두는 방식입니다.
# 값을 높이면 병렬 처리가 늘어나지만 자원 사용이 커지고, 낮추면 단순해지지만 처리량이 줄어듭니다.
max_threads = 4

# 에이전트가 깊게 파고들 수 있는 단계 수를 정합니다.
# 현재 값 `max_depth = 1`은 한 단계짜리 얕은 분해만 허용한다는 뜻입니다.
# 다른 대표 값은 2 이상처럼 더 깊게 두는 방식입니다.
# 값을 높이면 복잡한 하위 작업을 더 잘 나눌 수 있지만, 관리가 어려워질 수 있습니다.
max_depth = 1

# 하나의 작업이 오래 붙잡고 있을 수 있는 최대 시간을 정합니다.
# 현재 값 `1800`초는 30분 동안 실행을 허용한다는 뜻입니다.
# 다른 대표 값은 더 짧은 300초나 더 긴 3600초 같은 시간입니다.
# 값을 낮추면 정체된 작업을 빨리 끊을 수 있고, 높이면 큰 작업을 더 길게 맡길 수 있습니다.
job_max_runtime_seconds = 1800
